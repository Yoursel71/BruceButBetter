; PlatformIO Project Configuration File
; DIY Flipper Zero — ESP32-S3 N16R8 (16MB Flash, 8MB OPI PSRAM)
; Board: ESP-General
;
; The board carries a 128x64 I2C OLED. Two pin-compatible panel families fit
; the same wiring, but they need different driver settings, so each one has its
; own environment. Pick the one that matches the module that is actually
; fitted — a wrong controller, GRAM width or column offset keeps the screen
; dark.
;
;   esp32-s3-devkitc-1-psram           SH1106 / SSD1106G   132x64 GRAM, 2 px offset
;   esp32-s3-devkitc-1-psram-ssd1306   SSD1306 / SSD1315   128x64 GRAM, no offset

; ──────────────────────────────────────────────────────────────────────────────
; Shared configuration: pins, buses and UI. Panel-specific flags live in the
; environments below, so the two display variants cannot drift apart.
; ──────────────────────────────────────────────────────────────────────────────
[esp_general]
build_src_filter = ${env.build_src_filter} +<../boards/ESP-General>

build_flags =
    ${env.build_flags}
    -Iboards/ESP-General
    -DCORE_DEBUG_LEVEL=0
    -Os

    ; ── Device ────────────────────────────────────────────────────────────────
    ; DEVICE_NAME and BTN_ALIAS are defined once, in pins_arduino.h (no "redefined" warning).
    -DUSE_DIRECT_ROTATION=1
    -DFORCE_COLOR_NORMAL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSB_as_HID=1

    ; ── I2C bus (OLED + PN532) ────────────────────────────────────────────────
    -DGROVE_SDA=8
    -DGROVE_SCL=18

    ; ── OLED, shared part ─────────────────────────────────────────────────────
    ; Controller, GRAM width and column offset are set per environment below.
    -DHAS_SCREEN=1
    -DUSE_LOVYANGFX=1
    -DLOVYAN_BUS=Bus_I2C
    -DLOVYAN_I2C_BUS=1
    -DTFT_I2C_ADDR=0x3C
    -DTFT_RST=-1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=64
    -DTFT_MEM_HEIGHT=64
    -DTFT_OFFSET_Y=0
    -DTFT_INVERTION=0
    -DTFT_RGB_ORDER=0
    -DTFT_I2C_PORT=0
    -DTFT_I2C_WRITE=400000
    -DTFT_I2C_READ=400000
    -DTFT_SDA=8
    -DTFT_SCL=18
    -DTFT_ADDR=0x3C
    -DTFT_CS=-1
    -DTFT_BUSY_PIN=-1
    -DTFT_BL=-1
    -DBACKLIGHT=-1
    -DMINBRIGHT=0
    -DROTATION=2
    -DSMOOTH_FONT=0
    -DTFT_DISPON=0x29
    -DTFT_DISPOFF=0x28
    ; 1-bit OLED: snap every UI colour to pure white/black. Without this LovyanGFX turns
    ; mid-tone colours (purple theme, grey, red...) into a dot pattern and text looks speckled.
    -DTFT_MONOCHROME=1
    ; Native 128x64 UI: 4x2 main menu icon grid (16px icons), four-row lists, fixed-slot status bar.
    -DUI_COMPACT=1
    ; Only UP/DOWN/OK/BACK are wired on this build.
    -DNO_LR_BUTTONS=1

    ; ── Font sizes ────────────────────────────────────────────────────────────
    -DFP=1
    -DFM=1
    -DFG=2

    ; ── 128x64 OLED layout optimization ────────────────────────────────────────
    ; Shrink the status bar and margins for the small screen (defaults are
    ; tuned for color TFTs). This leaves more of the 64px height for content.
    -DSTATUS_BAR_HEIGHT=14   ; 8px status text, divider at y=11, then content
    -DBORDER_PAD_Y=14        ; content starts below the status bar
    -DBORDER_PAD_X=8         ; default 10 -> text clears the left border line (x=5)

    ; ── SPI bus ───────────────────────────────────────────────────────────────
    -DSPI_MOSI_PIN=11
    -DSPI_SCK_PIN=12
    -DSPI_MISO_PIN=13
    -DSPI_SS_PIN=10

    ; ── CC1101 ────────────────────────────────────────────────────────────────
    -DUSE_CC1101_VIA_SPI
    -DCC1101_GDO0_PIN=9
    -DCC1101_SS_PIN=10
    -DCC1101_MOSI_PIN=11
    -DCC1101_SCK_PIN=12
    -DCC1101_MISO_PIN=13

    ; ── MicroSD ───────────────────────────────────────────────────────────────
    -DSDCARD_CS=14
    -DSDCARD_MOSI=11
    -DSDCARD_SCK=12
    -DSDCARD_MISO=13

    ; ── NRF24L01 #1 (CE=4, CSN=5) ────────────────────────────────────────────
    -DUSE_NRF24_VIA_SPI
    -DNRF24_CE_PIN=4
    -DNRF24_SS_PIN=5
    -DNRF24_MOSI_PIN=11
    -DNRF24_SCK_PIN=12
    -DNRF24_MISO_PIN=13

    ; ── IR (RX=IO1, TX=IO2) ───────────────────────────────────────────────────
    -DRXLED=1
    -DTXLED=2
    -DLED_ON=HIGH
    -DLED_OFF=LOW
    -DIR_TX_PINS='{{"IR TX", 2}}'
    -DIR_RX_PINS='{{"IR RX", 1}}'

    ; ── RF433 (single-pin module - fallback, CC1101 preferred) ───────────────
    -DRF_TX_PINS='{{"RF TX", 2}}'
    -DRF_RX_PINS='{{"RF RX", 1}}'

    ; ── Buzzer ────────────────────────────────────────────────────────────────
    -DBUZZ_PIN=47

    ; ── Buttons (active-LOW) ──────────────────────────────────────────────────
    -DSEL_BTN=40
    -DUP_BTN=15
    -DDW_BTN=16
    -DL_BTN=38
    -DR_BTN=39
    -DESC_BTN=41
    -DBTN_ACT=LOW

    ; ── No GPS/LoRa/Ethernet/FM ──────────────────────────────────────────────
    -DDISABLE_LORA
    -DDISABLE_GPS
    -DDISABLE_ETHERNET
    -DDISABLE_FM

    ; ── Serial pins ──────────────────────────────────────────────────────────
    -DSERIAL_TX=43
    -DSERIAL_RX=44

lib_deps =
    ${env.lib_deps}
    etherkit/Etherkit Si5351@^2.1.4
    lovyan03/LovyanGFX@^1.2.0

lib_ignore =
    TFT_eSPI


; ──────────────────────────────────────────────────────────────────────────────
; 8MB flash, no PSRAM — SH1106 panel
; ──────────────────────────────────────────────────────────────────────────────
[env:esp32-s3-devkitc-1]
board                  = ESP-General
board_build.partitions = custom_8Mb.csv

build_src_filter = ${esp_general.build_src_filter}
build_flags      = ${esp_general.build_flags}
    -DLOVYAN_PANEL=Panel_SH110x
    -DTFT_MEM_WIDTH=132
    -DTFT_OFFSET_X=2
lib_deps         = ${esp_general.lib_deps}
lib_ignore       = ${esp_general.lib_ignore}


; ──────────────────────────────────────────────────────────────────────────────
; PSRAM variant (use for N16R8) — SH1106 panel, the default environment
; pio run -e esp32-s3-devkitc-1-psram
; ──────────────────────────────────────────────────────────────────────────────
[env:esp32-s3-devkitc-1-psram]
board_build.arduino.memory_type = qio_opi   ; enable 8MB OPI PSRAM
board_build.partitions          = custom_16Mb.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

board = ESP-General

build_src_filter = ${esp_general.build_src_filter}
build_flags      = ${esp_general.build_flags}
    -DLOVYAN_PANEL=Panel_SH110x
    -DTFT_MEM_WIDTH=132
    -DTFT_OFFSET_X=2
lib_deps         = ${esp_general.lib_deps}
lib_ignore       = ${esp_general.lib_ignore}


; ──────────────────────────────────────────────────────────────────────────────
; PSRAM variant (use for N16R8) — SSD1306 / SSD1315 panel
; pio run -e esp32-s3-devkitc-1-psram-ssd1306
; ──────────────────────────────────────────────────────────────────────────────
[env:esp32-s3-devkitc-1-psram-ssd1306]
board_build.arduino.memory_type = qio_opi   ; enable 8MB OPI PSRAM
board_build.partitions          = custom_16Mb.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

board = ESP-General

build_src_filter = ${esp_general.build_src_filter}
build_flags      = ${esp_general.build_flags}
    -DLOVYAN_PANEL=Panel_SSD1306
    -DTFT_MEM_WIDTH=128
    -DTFT_OFFSET_X=0
lib_deps         = ${esp_general.lib_deps}
lib_ignore       = ${esp_general.lib_ignore}
